<!doctype html>
<meta charset="utf-8">
<title>FLOWER POWER - OG card source</title>

<!-- The link-preview card for /flowers, composed in the DOM like the
     NU BREED card. The poster is 3:2 and its edges carry people (the
     sunflowers on the left, the raised peace sign on the right), so a
     1200x630 crop would cut someone out. It hangs whole instead, framed
     and lit, with the words on flat coal beside it.

       google-chrome --headless --disable-gpu --hide-scrollbars \
         --force-prefers-reduced-motion --virtual-time-budget=6000 \
         --window-size=1200,630 --screenshot=og.png scripts/og-flowers.html
-->

<link rel="stylesheet" href="../src/styles/fonts.css">

<style>
  :root {
    --coal: #120a03;
    --sun: #ffb32e;
    --ember: #ff7a2e;
    --uvy: #f4ff3d;
    --acid: #b8ff2e;
    --cream: #fff4e0;
    --cream-dim: #d8b487;
    --font-display: 'EMOTIQ', 'Arial Black', sans-serif;
    --font-body: 'Sora', system-ui, sans-serif;
    --font-mono: 'Space Mono', ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--coal); }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(520px 360px at 74% 52%, rgba(255, 122, 46, 0.2), transparent 70%),
      radial-gradient(420px 300px at 18% 30%, rgba(255, 179, 46, 0.1), transparent 70%),
      var(--coal);
    display: grid;
    grid-template-columns: 1fr 696px;
    align-items: center;
  }

  .words { padding: 0 24px 0 64px; display: grid; gap: 0; }

  .chapter {
    font-family: var(--font-mono);
    font-size: 16px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--acid);
    margin-bottom: 18px;
  }

  .title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 104px;
    line-height: 0.98;
  }

  .title span { display: block; }
  .title .sun { color: var(--sun); text-shadow: 0 0 18px rgba(255, 179, 46, 0.9), 0 0 70px rgba(255, 122, 46, 0.5); }
  .title .uvy { color: var(--uvy); text-shadow: 0 0 18px rgba(244, 255, 61, 0.85), 0 0 70px rgba(244, 255, 61, 0.4); }

  .sub {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 27px;
    color: var(--cream);
    margin-top: 18px;
  }

  .foot {
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin-top: 24px;
  }

  .art { padding-right: 56px; }

  .art img {
    display: block;
    width: 640px;
    height: 427px;
    border-radius: 6px;
    border: 1px solid rgba(255, 179, 46, 0.35);
    box-shadow: 0 0 46px rgba(255, 179, 46, 0.32), 0 26px 70px rgba(0, 0, 0, 0.6);
  }
</style>

<div class="card">
  <div class="words">
    <p class="chapter">TiTis on Decks presents</p>
    <h1 class="title"><span class="sun">Flower</span><span class="uvy">Power</span></h1>
    <p class="sub">A botanical rebellion</p>
    <p class="foot">One shared frequency</p>
  </div>
  <div class="art">
    <img src="../public/media/flowers/flower-power-1200.webp" alt="">
  </div>
</div>
